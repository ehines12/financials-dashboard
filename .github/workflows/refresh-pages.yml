name: Refresh data and deploy dashboard

# Target: weekdays at 6 AM, 9 AM, noon, 3 PM and 6 PM Central (a few minutes past the hour,
# since GitHub's top-of-hour cron slots are the most congested).
# Cron is UTC and has no DST, so each slot is listed for both CDT (UTC-5) and CST (UTC-6);
# the "gate" job runs first and only lets through the slot that matches Central local time
# (hour 6/9/12/15/18, Mon-Fri). Manual runs (workflow_dispatch) always go through.
on:
  schedule:
    - cron: "7 11,12,14,15,17,18,20,21,23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the accumulating FINRA cache + weekly heartbeat back to main
  pages: write
  id-token: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          h=$(TZ=America/Chicago date +%-H); d=$(TZ=America/Chicago date +%u)
          echo "Central time now: $(TZ=America/Chicago date '+%a %H:%M %Z')"
          case "$h" in 6|9|12|15|18) ok=1;; *) ok=0;; esac
          if [ "$ok" = 1 ] && [ "$d" -le 5 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Latest data/caches from previous runs (falls back to the copies committed in the repo)
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            web/data
            cache
          key: dashboard-data-${{ github.run_id }}
          restore-keys: dashboard-data-

      - name: Fetch data (FRED, Yahoo, FINRA, State Street)
        run: |
          set -o pipefail
          python fetch_data.py 2>&1 | tee fetch.log

      - name: Per-source fetch summary
        if: always()
        run: python ci_summary.py

      - name: Build self-contained snapshot
        run: |
          mkdir -p _site
          python export_html.py --no-fetch --out _site/index.html
          touch _site/.nojekyll
          grep -o '<title>[^<]*</title>' _site/index.html

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            web/data
            cache
          key: dashboard-data-${{ github.run_id }}

      # Small commits only: FINRA short-interest history (accumulates) and a weekly heartbeat.
      # The heartbeat guarantees repository activity at least weekly, so GitHub does not
      # auto-disable the schedule after 60 days of inactivity.
      - name: Commit accumulated cache + heartbeat
        continue-on-error: true   # never block the deploy; a failed push shows as a warning
        run: |
          date -u +%G-W%V > state/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/alloc_si.json state/heartbeat.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: update FINRA SI cache / heartbeat ($(date -u +%Y-%m-%dT%H:%MZ))"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::warning::could not push cache/heartbeat commit"; exit 1; fi
          git log -1 --format='pushed %h %s' 

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
