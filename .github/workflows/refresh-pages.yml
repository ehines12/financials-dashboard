name: Refresh data and deploy dashboard

# Target: weekdays at 6 AM, 9 AM, noon, 3 PM and 6 PM Central (7 min past the hour).
# Cron is UTC with no DST, so each slot is listed for both CDT (UTC-5) and CST (UTC-6), one line per UTC hour.
# The "gate" job decides from the cron line that fired (its INTENDED time), not the clock when the run
# starts, because GitHub often starts scheduled runs minutes to hours late. Manual runs always go through.
on:
  schedule:
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 15 * * *"
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
    - cron: "7 20 * * *"
    - cron: "7 21 * * *"
    - cron: "7 23 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the accumulating FINRA cache + weekly heartbeat back to main
  pages: write
  id-token: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(echo "$SCHED" | awk '{print $2}')                       # intended UTC hour
          OFF=$(TZ=America/Chicago date +%z | sed 's/^-0*//; s/00$//') # 5 (CDT) or 6 (CST)
          LH=$(( (H - OFF + 24) % 24 ))                                # intended Central hour
          # Intended Central date: today in Central, unless the run slipped past midnight
          D=$(TZ=America/Chicago date +%u); NOWH=$(TZ=America/Chicago date +%-H)
          if [ "$NOWH" -lt "$LH" ]; then D=$(( (D + 5) % 7 + 1 )); fi
          echo "fired for cron '$SCHED' -> intended ${LH}:07 Central (dow $D); started $(TZ=America/Chicago date '+%a %H:%M %Z')"
          case "$LH" in 6|9|12|15|18) ok=1;; *) ok=0;; esac
          if [ "$ok" = 1 ] && [ "$D" -le 5 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Latest data/caches from previous runs (falls back to the copies committed in the repo)
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            web/data
            cache
          key: dashboard-data-${{ github.run_id }}
          restore-keys: dashboard-data-

      - name: Fetch data (FRED, Yahoo, FINRA, State Street)
        run: |
          set -o pipefail
          python fetch_data.py 2>&1 | tee fetch.log

      - name: Per-source fetch summary
        if: always()
        run: python ci_summary.py

      - name: Build self-contained snapshot
        run: |
          mkdir -p _site
          python export_html.py --no-fetch --out _site/index.html
          touch _site/.nojekyll
          grep -o '<title>[^<]*</title>' _site/index.html

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            web/data
            cache
          key: dashboard-data-${{ github.run_id }}

      # Small commits only: FINRA short-interest history (accumulates) and a weekly heartbeat.
      # The heartbeat guarantees repository activity at least weekly, so GitHub does not
      # auto-disable the schedule after 60 days of inactivity.
      - name: Commit accumulated cache + heartbeat
        continue-on-error: true   # never block the deploy; a failed push shows as a warning
        run: |
          date -u +%G-W%V > state/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/alloc_si.json state/heartbeat.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: update FINRA SI cache / heartbeat ($(date -u +%Y-%m-%dT%H:%MZ))"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::warning::could not push cache/heartbeat commit"; exit 1; fi
          git log -1 --format='pushed %h %s' 

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
